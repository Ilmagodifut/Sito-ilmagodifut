<h1>FUTMAGO per Userscripts</h1>
<p>Copia il codice, poi incollalo dentro l'app Userscripts.</p>
<button id="b">COPIA IL CODICE</button>
<ol>
  <li>Premi COPIA qui sopra</li>
  <li>Apri l'app <b>Userscripts</b></li>
  <li>Premi <b>+</b> e crea un nuovo script</li>
  <li>Cancella cio' che c'e' e incolla</li>
  <li>Salva, poi apri la Web App di EA</li>
</ol>
<textarea id="t" readonly>// ==UserScript==
// @name         FUTMAGO
// @namespace    https://ilmagodifut.com
// @version      0.5.7
// @description  Risolve le SBC di EA FC direttamente nella Web App. Nessun account, nessun dato inviato: il club resta sul tuo dispositivo.
// @match        https://www.ea.com/*ultimate-team/web-app*
// @run-at       document-idle
// @inject-into  page
// ==/UserScript==

/*  ──────────────────────────────────────────────────────────────
    FUTMAGO — COME INSTALLARLO

    Vedi del testo invece di una pagina? E' normale, non e' un errore:
    questo file va dato al programma che lo fa girare, non letto.

    SU iPHONE (Userscripts)
      1. tocca il tasto a sinistra dell'indirizzo, qui sopra
      2. apri  Userscripts
      3. compare una striscia gialla: premila
      4. poi  Install

    SU ANDROID (Firefox + Violentmonkey)
      la schermata di installazione compare da sola: premi  Installa

    Poi apri la Web App di EA. FUTMAGO parte da solo, e non dovrai
    piu' rifare niente: gli aggiornamenti arrivano da soli.

    Non hai ancora l'app che serve? La guida completa e' qui:
    ilmagodifut.com/futmago
    ────────────────────────────────────────────────────────────── */

fetch('https://ilmagodifut.com/futmago.js?v=0.5.7-64592b30')
  .then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(eval)
  .catch(function (e) {
    console.error('[FUTMAGO] caricamento non riuscito:', e);
  });
</textarea>
<p><a href="/futmago">Torna alla pagina di FUTMAGO</a></p>
<script>
  var t = document.getElementById('t'), b = document.getElementById('b');
  b.addEventListener('click', function () {
    t.select(); t.setSelectionRange(0, 999999);
    var fatto = false;
    try { fatto = document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard) { navigator.clipboard.writeText(t.value).then(function () {}, function () {}); fatto = true; }
    b.textContent = fatto ? 'COPIATO' : 'SELEZIONA E COPIA A MANO';
    setTimeout(function () { b.textContent = 'COPIA IL CODICE'; }, 2200);
  });
</script>
